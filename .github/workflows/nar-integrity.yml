name: NAR integrity checks
on:
  workflow_dispatch:
  push:
    paths: ['nar_*.py', 'tests/**', '.github/workflows/nar-integrity.yml']
  pull_request:
    paths: ['nar_*.py', 'tests/**', '.github/workflows/nar-integrity.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pandas>=2.1,<3' numpy
      - run: python -m unittest discover -s tests -v
