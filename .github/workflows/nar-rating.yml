
name: NAR horse rating

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rating:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Download horse history
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: nar-history.yml
          name: nar-horse-history
          path: history-data
          branch: main

      - name: Inspect rating options
        run: python nar_rating.py --help
