
name: NAR horse rating

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rating:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install 'pandas>=2.1,<3' numpy

      - name: Build history from checked-out archives
        run: python nar_history.py --input . --output data/processed
      - name: Inspect rating options
        run: python nar_rating.py --help
        

      
      - name: Run historical rating
        run: |
          python nar_rating.py \
            --input data/processed/horse_history.csv \
            --date 2026-07-31 \
            --track 川崎 \
            --race 1 \
            --output rating_result.csv

      - name: Upload rating result
        uses: actions/upload-artifact@v4
        with:
          name: nar-rating-result
          path: rating_result.csv
          if-no-files-found: error
  
