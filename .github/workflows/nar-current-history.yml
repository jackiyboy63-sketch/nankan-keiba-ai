name: NAR current month history check
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      installation_check:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental-v3-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2.1,<3'
      - run: python nar_history.py --input . --output data/processed
      - name: Set source cache key
        run: echo "SOURCE_DAY=$(TZ=Asia/Tokyo date +%Y%m%d)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: data/current_results/sources
          key: nar-current-v1-${{ env.SOURCE_DAY }}-${{ github.run_id }}
          restore-keys: nar-current-v1-
      - name: Supplement verified earlier dates
        if: ${{ !inputs.installation_check }}
        run: python -u nar_current_history.py
      - name: Use base history for one-minute installation check
        if: ${{ inputs.installation_check }}
        run: cp data/processed/horse_history.csv data/processed/horse_history_current.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nar-current-history-${{ github.run_id }}
          path: |
            data/current_results/
            data/processed/horse_history_current.csv
          if-no-files-found: error
          retention-days: 90
