name: NAR chronological payout benchmark
on:
  workflow_dispatch:
    inputs:
      start:
        description: First evaluation date
        default: '2026-06-01'
        required: true
      end:
        description: Last evaluation date
        default: '2026-09-30'
        required: true
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pandas>=2.1,<3' numpy
      - run: python -m unittest discover -s tests -v
      - run: python nar_history.py --input . --output data/processed
      - name: Compare fixed policies
        env:
          START_DATE: ${{ inputs.start }}
          END_DATE: ${{ inputs.end }}
        run: python nar_walkforward.py --start "$START_DATE" --end "$END_DATE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nar-chronological-payout-benchmark
          path: walkforward_results/
          if-no-files-found: error
