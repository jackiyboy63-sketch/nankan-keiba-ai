name: NAR monthly race archive collection

on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official NAR monthly ZIPs
        id: fetch
        continue-on-error: true
        run: python nar_fetch.py --months 24 --output data
      - name: Commit verified ZIPs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*_race.zip
          if ! git diff --cached --quiet; then
            git commit -m 'data: collect official NAR race archives'
            git push
          fi
      - name: Report missing downloads
        if: steps.fetch.outcome == 'failure'
        run: |
          echo 'Some months were not collected. Inspect fetch logs; official download URL discovery may need updating.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
