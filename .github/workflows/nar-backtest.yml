name: NAR monthly backtest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Download horse history
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: nar-history.yml
          name: nar-horse-history
          path: history-data
          branch: main
      - name: Run June 2026 backtest
        run: |
          python nar_backtest.py \
            --input history-data/data/processed/horse_history.csv \
            --month 2026-06 \
            --min-runners 1 \
            --output-dir backtest_results
      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nar-backtest-june-2026
          path: backtest_results/
          if-no-files-found: warn
