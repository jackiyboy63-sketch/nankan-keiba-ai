name: NAR monthly backtest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install 'pandas>=2.1,<3' numpy
      - name: Build history from checked-out archives
        run: python nar_history.py --input . --output data/processed
      - name: Run July 2026 backtest
        run: |
          python nar_backtest.py \
            --input data/processed/horse_history.csv \
            --month 2026-07 \
            --min-runners 1 \
            --output-dir backtest_results
      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nar-backtest-july-2026
          path: backtest_results/
          if-no-files-found: warn
