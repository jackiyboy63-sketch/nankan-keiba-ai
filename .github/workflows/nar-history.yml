
name: NAR horse history build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install "pandas>=2.1,<3"

      - name: Build horse history
        run: python nar_history.py

      - name: Upload history results
        uses: actions/upload-artifact@v4
        with:
          name: nar-horse-history
          
          path: |
            data/processed/
            output/
          if-no-files-found: error
