name: NAR historical learned probability comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental-v3-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pandas>=2.1,<3' numpy
      - run: python -m unittest discover -s tests -v
      - run: python nar_history.py --input . --output data/processed
      - run: python -u nar_learn_history.py --output learning_results/initial-20261029
      - run: python -u nar_compare_learned.py --results learning_results/initial-20261029
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nar-learned-history-comparison
          path: learning_results/
          if-no-files-found: error
