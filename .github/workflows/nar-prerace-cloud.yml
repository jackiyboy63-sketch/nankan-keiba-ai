name: NAR cloud prerace archive

on:
  schedule:
    # UTC -> JST 10:07 and 15:07. Scheduled triggers require this file on default branch.
    - cron: '7 1,6 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Session minutes (1-345); use 1 for installation check'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: nar-prerace-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  history:
    if: github.event_name == 'workflow_dispatch' || vars.NAR_PRERACE_ENABLED == 'true'
    uses: ./.github/workflows/nar-current-history.yml
    with:
      installation_check: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.minutes == '1' }}
  archive:
    needs: history
    # Explicit opt-in avoids unexpected private-repository runner usage.
    if: always() && (github.event_name == 'workflow_dispatch' || vars.NAR_PRERACE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SESSION_MINUTES: ${{ github.event.inputs.minutes || '345' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental-v3-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rating dependencies
        run: python -m pip install 'pandas>=2.1,<3'
      - name: Build fallback history from committed archives
        run: python nar_history.py --input . --output data/processed
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: nar-current-history-${{ github.run_id }}
          path: data
      - name: Select available history
        run: |
          if test -f data/processed/horse_history_current.csv; then
            echo 'RATING_HISTORY=data/processed/horse_history_current.csv' >> "$GITHUB_ENV"
          else
            echo 'RATING_HISTORY=data/processed/horse_history.csv' >> "$GITHUB_ENV"
            echo 'Current-month supplement unavailable; archived history used. Review history coverage before using scores.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Capture verified pre-race data
        run: python -u nar_cloud_prerace.py --minutes "$SESSION_MINUTES" --history "$RATING_HISTORY"
      - name: Save capture files and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nar-prerace-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/prerace_runs/
            data/prerace_watch/
          if-no-files-found: warn
          retention-days: 90
      - name: Explain saved record
        if: always()
        run: |
          echo 'Open this run -> Artifacts to download the recorded pages, scores and diagnostics. Retention: 90 days or repository policy limit.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A green job is not proof that any race was captured. Inspect run_manifest.json status=completed_prerace and cloud_summary.json.' >> "$GITHUB_STEP_SUMMARY"
